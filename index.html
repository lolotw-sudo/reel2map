<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="臉書美食地圖">
<meta name="theme-color" content="#1F2A44">
<title>臉書美食地圖 · reel2map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1F2A44;
  --paper:#F1ECDF;
  --paper-2:#E8E1CE;
  --vermillion:#C4451C;
  --moss:#6B7A5E;
  --line:#D8CFB8;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%; margin:0; overscroll-behavior:none;}
body{
  font-family:'Zen Kaku Gothic New', sans-serif;
  background:var(--paper);
  color:var(--ink);
}
#map{
  position:absolute; inset:0;
  filter:saturate(0.55) contrast(0.96) brightness(1.03);
}
.leaflet-control-attribution{font-size:9px; opacity:0.6;}

/* ---- Top bar ---- */
#topbar{
  position:absolute; top:0; left:0; right:0; z-index:500;
  padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;
  background:linear-gradient(180deg, rgba(31,42,68,0.92) 0%, rgba(31,42,68,0.55) 70%, rgba(31,42,68,0) 100%);
  pointer-events:none;
}
#topbar h1{
  margin:0; color:var(--paper);
  font-family:'Shippori Mincho', serif; font-weight:700;
  font-size:19px; letter-spacing:0.06em;
  text-shadow:0 1px 6px rgba(0,0,0,0.25);
}
#topbar .sub{
  color:#D8CFB8; font-size:11px; margin-top:2px; letter-spacing:0.04em;
}
#chips{
  display:flex; gap:8px; margin-top:10px; overflow-x:auto;
  pointer-events:auto; padding-bottom:2px;
}
#chips::-webkit-scrollbar{display:none;}
.chip{
  flex:0 0 auto;
  font-family:'Zen Kaku Gothic New', sans-serif;
  font-size:12.5px; font-weight:700;
  color:var(--paper); background:rgba(255,255,255,0.12);
  border:1px solid rgba(255,255,255,0.35);
  border-radius:100px; padding:6px 14px;
  display:flex; align-items:center; gap:5px;
  cursor:pointer;
}
.chip .dot{width:6px; height:6px; border-radius:50%; background:currentColor;}
.chip.active{
  background:var(--vermillion); border-color:var(--vermillion); color:#fff;
}

/* ---- Custom pin ---- */
.pin{
  width:30px; height:30px; border-radius:50%;
  background:var(--paper);
  border:2px solid var(--ink);
  display:flex; align-items:center; justify-content:center;
  font-size:14px;
  box-shadow:0 2px 6px rgba(31,42,68,0.35);
}
/* 收藏的地標：外框加粗變紅，不加任何彩色光暈 */
.pin.fav{border:3.5px solid #D62828;}
.pin.hi{
  background:var(--vermillion); border-color:var(--vermillion); color:#fff;
}

/* ---- Bottom sheet ---- */
#sheet-scrim{
  position:absolute; inset:0; z-index:600;
  background:rgba(31,42,68,0.28);
  opacity:0; pointer-events:none;
  transition:opacity 0.25s ease;
}
#sheet-scrim.show{opacity:1; pointer-events:auto;}
#sheet{
  position:absolute; left:0; right:0; bottom:0; z-index:700;
  background:var(--paper);
  border-top:1px solid var(--line);
  border-radius:20px 20px 0 0;
  box-shadow:0 -8px 24px rgba(31,42,68,0.22);
  transform:translateY(105%);
  transition:transform 0.32s cubic-bezier(.32,.72,0,1);
  max-height:62vh;
  display:flex; flex-direction:column;
  padding-bottom:env(safe-area-inset-bottom);
}
#sheet.show{transform:translateY(0);}
#sheet .grabber{
  width:36px; height:4px; border-radius:4px; background:var(--line);
  margin:10px auto 4px;
  cursor:pointer;
}
#sheet-body{
  padding:6px 22px 24px; overflow-y:auto;
}
#sheet-cat{
  display:inline-flex; align-items:center; gap:6px;
  font-size:11px; font-weight:700; color:var(--moss);
  letter-spacing:0.08em; margin-top:6px;
}
#sheet-cat::before{content:"●"; font-size:8px;}
#sheet-head{display:flex; align-items:flex-start; gap:10px;}
#sheet-name{
  flex:1;
  font-family:'Shippori Mincho', serif; font-weight:700;
  font-size:22px; margin:6px 0 2px; line-height:1.35;
}
#sheet-fav{
  flex:0 0 auto; margin-top:6px;
  width:38px; height:38px; border-radius:50%;
  background:transparent; border:1.5px solid var(--ink);
  color:var(--ink); font-size:18px; line-height:1;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; padding:0;
}
#sheet-fav.on{color:var(--vermillion); border-color:var(--vermillion);}
#sheet-addr{
  font-size:13px; color:#5b5748; line-height:1.5; margin-bottom:2px;
}
#sheet-dist{
  font-size:12.5px; color:var(--moss); font-weight:700; margin-bottom:10px;
}
#sheet-dist:empty{display:none;}
#sheet-note{
  font-size:13.5px; line-height:1.7; color:var(--ink);
  background:var(--paper-2); border-radius:12px; padding:12px 14px;
  margin-bottom:16px; border:1px solid var(--line);
}
#sheet-note:empty{display:none;}
#sheet-memo-label{
  display:block; font-size:11px; font-weight:700; color:var(--moss);
  letter-spacing:0.08em; margin-bottom:6px;
}
#sheet-memo{
  display:block; width:100%; min-height:72px; resize:vertical;
  font-family:'Zen Kaku Gothic New', sans-serif;
  font-size:16px;   /* 16px 以上 iOS 點進去才不會自動放大畫面 */
  line-height:1.6; color:var(--ink);
  background:#fff; border:1px solid var(--line); border-radius:12px;
  padding:10px 12px; margin-bottom:16px; outline:none;
}
#sheet-memo:focus{border-color:var(--ink);}
#sheet-actions{display:flex; gap:10px;}
.btn{
  flex:1; display:flex; align-items:center; justify-content:center; gap:6px;
  padding:13px 10px; border-radius:100px;
  font-family:'Zen Kaku Gothic New', sans-serif; font-weight:700; font-size:13.5px;
  text-decoration:none; border:none; cursor:pointer;
}
.btn-play{
  background:var(--vermillion); color:#fff;
  box-shadow:0 3px 10px rgba(196,69,28,0.35);
}
.btn-nav{
  background:transparent; color:var(--ink); border:1.5px solid var(--ink);
}

/* ---- Locate control ---- */
.locate-btn{
  width:36px; height:36px; border-radius:50%;
  background:var(--paper); border:2px solid var(--ink);
  display:flex; align-items:center; justify-content:center;
  font-size:17px; cursor:pointer;
  box-shadow:0 2px 8px rgba(31,42,68,0.3);
}
.locate-btn.active{background:var(--vermillion); border-color:var(--vermillion);}
.locate-btn.loading{opacity:0.55;}
.me-dot{
  width:16px; height:16px; border-radius:50%;
  background:#2F6FE4; border:3px solid #fff;
  box-shadow:0 0 0 4px rgba(47,111,228,0.25), 0 2px 6px rgba(0,0,0,0.3);
}

/* ---- Status strip (loading / error / hint) ---- */
#status{
  position:absolute; left:16px; right:16px; z-index:400;
  bottom:calc(env(safe-area-inset-bottom) + 18px);
  background:rgba(31,42,68,0.92); color:var(--paper);
  font-size:12.5px; text-align:center; line-height:1.6;
  border-radius:14px; padding:12px 16px;
  box-shadow:0 6px 18px rgba(0,0,0,0.25);
}
#status b{color:#fff;}
#status.hide{display:none;}
#status .retry{
  display:inline-block; margin-top:8px;
  background:var(--vermillion); color:#fff;
  border:none; border-radius:100px; padding:7px 16px;
  font-family:inherit; font-size:12px; font-weight:700; cursor:pointer;
}
</style>
</head>
<body>

<div id="map"></div>

<div id="topbar">
  <h1>臉書美食地圖</h1>
  <div class="sub">從珍藏短片轉來的旅の栞 · reel2map</div>
  <div id="chips"></div>
</div>

<div id="status">正在讀取地點資料…</div>

<div id="sheet-scrim"></div>
<div id="sheet">
  <div class="grabber"></div>
  <div id="sheet-body">
    <div id="sheet-cat"></div>
    <div id="sheet-head">
      <div id="sheet-name"></div>
      <button id="sheet-fav" type="button" aria-label="加入收藏">♡</button>
    </div>
    <div id="sheet-addr"></div>
    <div id="sheet-dist"></div>
    <div id="sheet-note"></div>
    <label id="sheet-memo-label" for="sheet-memo">✏️ 我的說明</label>
    <textarea id="sheet-memo" placeholder="寫點自己的筆記，例如：想點什麼、跟誰去、營業時間…"></textarea>
    <div id="sheet-actions">
      <a id="sheet-play" class="btn btn-play" target="_blank" rel="noopener">🎬 看短片</a>
      <a id="sheet-nav" class="btn btn-nav" target="_blank" rel="noopener">🧭 導航</a>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
/* ============================================================
   reel2map 資料層
   資料來源是 Google 試算表（發布為 CSV），不寫在這個檔案裡。
   要新增地點：直接在試算表加一列，重新整理這個網頁就會出現。
   欄位：名稱 / 地址 / 緯度 / 經度 / 影片連結 / 備註 / 分類 / 類型（選填）
   「類型」欄有填就以它為準（填類型名稱或任何 emoji 都可以）；
   留空則依店名＋備註的關鍵字自動判定圖示。
   ============================================================ */

/* 每個人一張地圖：網址加 ?who=jun 就讀 Jun 的試算表；沒帶就是 LOLO 的 */
const MAPS = {
  lolo: { title:'臉書美食地圖', center:[33.60, 130.45], csv:'https://docs.google.com/spreadsheets/d/e/2PACX-1vQi4beiBychHbMEZRHcu1Sd0_n77o6UXQ1_s81carfdzJD-fwGYO9wmJXXQr55s-k1kfn4v5m5XywP6/pub?gid=46533551&single=true&output=csv' },
  jun:  { title:'Jun 的美食地圖', center:[35.68, 139.76], csv:'https://docs.google.com/spreadsheets/d/e/2PACX-1vShOS6TPKiaDpSfbLNEkp_hMPCKtnQpD_omiN0kljbXAs4iGjmK-CB9r9p5yi-1ThxZ2EkRnKSm2pRq/pub?gid=1634312988&single=true&output=csv' },
};
const WHO = new URLSearchParams(location.search).get('who');
const ME = MAPS.hasOwnProperty(WHO) ? MAPS[WHO] : MAPS.lolo;
const CSV_URL = ME.csv;
const STORE_KEY = 'reel2map:' + (MAPS.hasOwnProperty(WHO) ? WHO : 'lolo');
document.title = ME.title + ' · reel2map';
document.querySelector('h1').textContent = ME.title;
document.querySelector('meta[name=apple-mobile-web-app-title]').content = ME.title;   // 加到主畫面時的名稱

const CAT_COLORS = ['#1F2A44', '#6B7A5E', '#8C6A3F', '#4A6572', '#8F5A5A', '#5B5E8C'];

/* 地標類型：由上往下比對，先中先贏。試算表「類型」欄有填時直接採用，不走這裡 */
const TYPES = [
  { t:'神社',   e:'⛩️', re:/神社|神宮|八幡宮|稲荷|御朱印|藏院|蔵院|お寺/ },
  { t:'壽司',   e:'🍣', re:/寿司|鮨|壽司|すし|sushi/i },
  { t:'居酒屋', e:'🏮', re:/居酒屋|屋台|酒場/ },
  { t:'海鮮',   e:'🦐', re:/海鮮|鮮魚|魚市場|おさかな|うに|雲丹|牡蠣|生蠔|海胆/ },
  { t:'燒肉',   e:'🥩', re:/焼肉|燒肉|焼鳥|串焼|ホルモン|ジンギスカン|じんぎすかん|骨付|牛丼|ステーキ/ },
  { t:'炸物',   e:'🍤', re:/天ぷら|天婦羅|とんかつ|豬排|唐揚|フライ/ },
  { t:'咖啡',   e:'☕', re:/咖啡|珈琲|コーヒー|カフェ|coffee|cafe|喫茶/i },
  { t:'甜點',   e:'🍰', re:/甜點|スイーツ|パフェ|聖代|かき氷|ジェラート|甘味|菓子|ケーキ|プリン|霜淇淋|アイス|ドーナツ|donut|鬆餅|パンケーキ|フルーツ|水果/i },
  { t:'麵包',   e:'🥐', re:/パン|ぱん|麵包|麺包|ベーカリー|bakery|フランス/i },
  { t:'麵食',   e:'🍜', re:/ラーメン|拉麵|中華そば|そうめん|蕎麦|そば|うどん|烏龍麵|冷麺|冷麵|麺|豚骨/ },
  { t:'玩樂',   e:'🎡', re:/免稅|免税|ゲーム|雲霄飛車|teamLab|樂園|楽園/i },
  { t:'景點',   e:'🏞️', re:/公園|花田|峡|渓谷|滝|瀑布|鍾乳洞|夜景|展望|タワー|道の駅|温泉|市場|海灘/ },
];
const TYPE_DEFAULT = { t:'美食', e:'🍽️' };

/* 回傳 {t:類型名, e:圖示}。手動填的「類型」優先：
   對得上類型名就用對應圖示；對不上就把填的字直接當圖示（所以填 emoji 也行） */
function typeOf(p){
  if (p.type){
    const hit = TYPES.find(x => x.t === p.type);
    return hit || { t: p.type, e: p.type };
  }
  const text = p.name + ' ' + p.note;
  return TYPES.find(x => x.re.test(text)) || TYPE_DEFAULT;
}

/* 逗號分隔解析：支援引號包住、內含逗號或換行的欄位 */
function parseCSV(text){
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (inQuotes){
      if (c === '"'){
        if (text[i+1] === '"'){ field += '"'; i++; }
        else inQuotes = false;
      } else field += c;
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ','){ row.push(field); field = ''; }
      else if (c === '\n'){ row.push(field); rows.push(row); row = []; field = ''; }
      else if (c !== '\r') field += c;
    }
  }
  if (field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => r.some(v => v.trim() !== ''));
}

function rowsToData(rows){
  const header = rows[0].map(h => h.trim());
  const idx = name => header.indexOf(name);
  const iName = idx('名稱'), iAddr = idx('地址'), iLat = idx('緯度'),
        iLng = idx('經度'), iVideo = idx('影片連結'), iNote = idx('備註'),
        iCat = idx('分類'), iType = idx('類型');   // 類型欄可能不存在（iType = -1），typeOf 會自動判定

  const byCat = new Map();
  rows.slice(1).forEach(r => {
    const lat = parseFloat(r[iLat]), lng = parseFloat(r[iLng]);
    if (!isFinite(lat) || !isFinite(lng)) return;   // 沒有有效座標就跳過，不畫錯位置
    const cat = (r[iCat] || '未分類').trim();
    if (!byCat.has(cat)) byCat.set(cat, []);
    byCat.get(cat).push({
      name: (r[iName] || '').trim(),
      addr: (r[iAddr] || '').trim(),
      lat, lng,
      video: (r[iVideo] || '').trim(),
      note: (r[iNote] || '').trim(),
      category: cat,
      type: (iType >= 0 && r[iType] || '').trim()
    });
  });

  return [...byCat.entries()].map(([category, points], i) => ({
    category, color: CAT_COLORS[i % CAT_COLORS.length], points
  }));
}

/* ============================================================
   收藏＋我的說明：存在這支手機/瀏覽器的 localStorage，不會寫回試算表
   以「名稱＋座標」辨識地點，試算表改了店名或座標就會對不上
   ============================================================ */

function placeKey(p){ return p.name + '|' + p.lat.toFixed(5) + ',' + p.lng.toFixed(5); }
function loadStore(){
  try {
    const s = JSON.parse(localStorage.getItem(STORE_KEY));
    if (s && typeof s === 'object') return { favs: s.favs || {}, memos: s.memos || {} };
  } catch (e) {}
  return { favs:{}, memos:{} };
}
const store = loadStore();
function saveStore(){
  try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); } catch (e) {}
}
const isFav = p => !!store.favs[placeKey(p)];

/* ============================================================
   渲染層
   ============================================================ */

const map = L.map('map', { zoomControl:false, attributionControl:true })
  .setView(ME.center, 10);
L.control.zoom({position:'bottomright'}).addTo(map);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

const statusEl = document.getElementById('status');
const chipsEl = document.getElementById('chips');
const markersByCat = {};
let DATA = [];
const FAV_CHIP = "♥ 收藏";
let activeCat = "全部";
let currentP = null;
let userLatLng = null;
let userMarker = null;

/* ---- 目前位置：算距離用經緯度直線距離（Haversine），不含實際路徑 ---- */
function haversine(lat1, lng1, lat2, lng2){
  const R = 6371000, toRad = d => d * Math.PI / 180;
  const dLat = toRad(lat2 - lat1), dLng = toRad(lng2 - lng1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}
function formatDist(m){
  return m < 1000 ? Math.round(m) + ' 公尺' : (m / 1000).toFixed(1) + ' 公里';
}

function locateMe(){
  const btn = document.getElementById('locate-btn');
  if (!navigator.geolocation){
    statusEl.classList.remove('hide');
    statusEl.textContent = '這個瀏覽器不支援定位功能';
    return;
  }
  btn.classList.add('loading');
  navigator.geolocation.getCurrentPosition(
    pos => {
      userLatLng = [pos.coords.latitude, pos.coords.longitude];
      btn.classList.remove('loading');
      btn.classList.add('active');
      if (userMarker) map.removeLayer(userMarker);
      userMarker = L.marker(userLatLng, {
        icon: L.divIcon({ className:'', html:'<div class="me-dot"></div>', iconSize:[16,16], iconAnchor:[8,8] }),
        zIndexOffset: 1000, interactive:false
      }).addTo(map);
      statusEl.classList.remove('hide');
      statusEl.textContent = '📍 已定位，點圖釘看跟你的距離';
    },
    err => {
      btn.classList.remove('loading');
      statusEl.classList.remove('hide');
      statusEl.textContent = err.code === 1
        ? '無法定位：請允許瀏覽器使用你的位置'
        : '無法定位，請稍後再試';
    },
    { enableHighAccuracy:true, timeout:10000 }
  );
}

const LocateControl = L.Control.extend({
  options: { position:'bottomright' },
  onAdd: function(){
    const btn = L.DomUtil.create('div', 'locate-btn');
    btn.id = 'locate-btn';
    btn.textContent = '🧭';
    L.DomEvent.disableClickPropagation(btn);
    L.DomEvent.on(btn, 'click', locateMe);
    return btn;
  }
});
map.addControl(new LocateControl());

function makeIcon(emoji, hi, fav){
  return L.divIcon({
    className:'', html:`<div class="pin${hi?' hi':''}${fav?' fav':''}">${emoji}</div>`,
    iconSize:[30,30], iconAnchor:[15,15]
  });
}

function renderFavBtn(p){
  const btn = document.getElementById('sheet-fav');
  const on = isFav(p);
  btn.textContent = on ? '♥' : '♡';
  btn.classList.toggle('on', on);
  btn.setAttribute('aria-label', on ? '取消收藏' : '加入收藏');
}

function openSheet(p){
  currentP = p;
  const ty = typeOf(p);
  document.getElementById('sheet-cat').textContent = p.category + ' · ' + ty.e + ' ' + ty.t;
  document.getElementById('sheet-name').textContent = p.name;
  document.getElementById('sheet-addr').textContent = p.addr;
  document.getElementById('sheet-dist').textContent = userLatLng
    ? '📍 距離你約 ' + formatDist(haversine(userLatLng[0], userLatLng[1], p.lat, p.lng))
    : '';
  document.getElementById('sheet-note').textContent = p.note;
  document.getElementById('sheet-memo').value = store.memos[placeKey(p)] || '';
  renderFavBtn(p);
  document.getElementById('sheet-play').href = p.video;
  document.getElementById('sheet-nav').href = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(p.addr);
  document.getElementById('sheet').classList.add('show');
  document.getElementById('sheet-scrim').classList.add('show');
  statusEl.classList.add('hide');
}
function closeSheet(){
  document.getElementById('sheet-memo').blur();
  document.getElementById('sheet').classList.remove('show');
  document.getElementById('sheet-scrim').classList.remove('show');
}
document.getElementById('sheet-scrim').addEventListener('click', closeSheet);

document.getElementById('sheet-fav').addEventListener('click', () => {
  const p = currentP;
  if (!p) return;
  const k = placeKey(p);
  if (store.favs[k]) delete store.favs[k];
  else store.favs[k] = true;
  saveStore();
  renderFavBtn(p);
  p.marker.setIcon(makeIcon(typeOf(p).e, false, isFav(p)));
  applyFilter();   // setIcon 會換新的 DOM，要重新套用篩選
});

/* 邊打邊存，不用按儲存 */
document.getElementById('sheet-memo').addEventListener('input', e => {
  if (!currentP) return;
  const k = placeKey(currentP), v = e.target.value;
  if (v.trim()) store.memos[k] = v;
  else delete store.memos[k];
  saveStore();
});
document.getElementById('sheet').querySelector('.grabber').addEventListener('click', closeSheet);

function renderChips(){
  const cats = ["全部", FAV_CHIP, ...DATA.map(g => g.category)];
  chipsEl.innerHTML = cats.map(c =>
    `<div class="chip${c===activeCat?' active':''}" data-cat="${c}"><span class="dot"></span>${c}</div>`
  ).join('');
  chipsEl.querySelectorAll('.chip').forEach(el => {
    el.addEventListener('click', () => {
      activeCat = el.dataset.cat;
      renderChips();
      applyFilter();
    });
  });
}

function applyFilter(){
  Object.entries(markersByCat).forEach(([cat, markers]) => {
    markers.forEach(m => {
      const show = activeCat === "全部" || activeCat === cat
        || (activeCat === FAV_CHIP && isFav(m.point));
      const el = m.getElement();
      if (el) el.style.display = show ? '' : 'none';
    });
  });
}

function render(){
  const allBounds = [];
  DATA.forEach(group => {
    markersByCat[group.category] = [];
    group.points.forEach(p => {
      const marker = L.marker([p.lat, p.lng], { icon: makeIcon(typeOf(p).e, false, isFav(p)) }).addTo(map);
      marker.point = p;
      p.marker = marker;
      marker.on('click', () => openSheet(p));
      markersByCat[group.category].push(marker);
      allBounds.push([p.lat, p.lng]);
    });
  });
  if (allBounds.length) map.fitBounds(allBounds, { padding:[60,60] });
  renderChips();

  const total = DATA.reduce((n, g) => n + g.points.length, 0);
  statusEl.innerHTML = `📍 ${total} 個地點，點圓形印章看店家資訊<br>看完短片後<b>返回這裡即可</b>，不會弄丟位置`;
}

async function load(){
  statusEl.classList.remove('hide');
  statusEl.textContent = '正在讀取地點資料…';
  try {
    const res = await fetch(CSV_URL + '&t=' + Date.now());   // 加時間戳避開快取
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const rows = parseCSV(await res.text());
    DATA = rows.length < 2 ? [] : rowsToData(rows);   // 只有標題列＝還沒有地點，照樣顯示空地圖
    render();
  } catch (err) {
    statusEl.innerHTML = '讀不到地點資料，可能是網路不通或試算表尚未發布。<br><button class="retry">再試一次</button>';
    statusEl.querySelector('.retry').addEventListener('click', load);
  }
}

load();
</script>
</body>
</html>
